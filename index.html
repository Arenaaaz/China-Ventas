async function save(c,id){
 if(c==='products')return saveProduct(id);
 const o={};let ok=true;
 F[c].f.forEach(([k,,t])=>{let v=$('#f_'+k).value.trim();if(t=='number')v=v===''?0:+v;else if(!v&&!OPT.includes(k))ok=false;o[k]=v});
 if(!ok)return toast('Completa los campos (¿ya hay socios o pedidos?)');
 if(c=='orders'&&!o.qty)return toast('Indica las unidades');
 if(c==='expenses'){

  if(o.paymentType==='partner'&&!S.partners.some(partner=>partner.id==o.paidByPartnerId))return toast('Selecciona el socio que cubrió el gasto.');
  if(o.paymentType==='business')o.paidByPartnerId='';
 }
 if(c==='sales'){

  if(!Number.isInteger(o.qty)||o.qty<1)return toast('Indica una cantidad válida.');

  }
  if(o.productId){
   const p=S.products.find(x=>x.id==o.productId),previous=id?S.sales.find(x=>x.id==id):null;
   if(!p)return toast('El producto seleccionado ya no existe.');
   const sold=(S.sales.filter(x=>x.productId==p.id).reduce((sum,x)=>sum+num(x.qty),0))-(previous&&previous.productId==p.id?num(previous.qty):0);
   if(o.qty>num(p.stock)-sold)return toast(`Stock insuficiente: quedan ${Math.max(0,num(p.stock)-sold)} unidades.`);
   if($('#f_total').value.trim()==='')o.total=num(p.price);
   o.productName=previous&&previous.productId==p.id&&previous.productName||p.name;
   o.productCost=previous&&previous.productId==p.id&&previous.productCost!=null?num(previous.productCost):num(p.cost);
  }
  if(!Number.isFinite(o.total)||o.total<=0)return toast('Indica un precio de venta por unidad mayor que cero.');
  o.unitPrice=o.total;
  o.total=o.unitPrice*o.qty;
 }
 if(c=='tasks'){const t=cfg().catalog.find(x=>x.name==o.type);o.pts=num(o.qty)*(t?num(t.pts):0)}
 $('#sv').disabled=true;
 try{id?await db.collection(c).doc(id).set(o):await db.collection(c).add(o);closeM()}

}
async function saveOrder(id){
 syncOrderDraft();
 const name=$('#orderName').value.trim(),date=$('#orderDate').value,shipping=Number($('#orderShipping').value);
 if(!date||!Number.isFinite(shipping)||shipping<0)return toast('Revisa la fecha y el costo del envío.');
 if(!orderDraftItems.length||orderDraftItems.some(item=>!item.name||!Number.isInteger(Number(item.qty))||Number(item.qty)<1||!Number.isFinite(Number(item.unitCost))||Number(item.unitCost)<0||!Number.isFinite(Number(item.salePrice))||Number(item.salePrice)<=0))return toast('Completa cada prenda con nombre, cantidad, costo y precio de venta válidos.');
 const quantity=orderDraftItems.reduce((sum,item)=>sum+Number(item.qty),0);
 const merchandise=orderDraftItems.reduce((sum,item)=>sum+Number(item.qty)*Number(item.unitCost),0);
 const total=merchandise+shipping;
 const contributions=[...document.querySelectorAll('#orderPartners input')].map(input=>({partnerId:input.dataset.partnerId,amount:Number(input.value)}));
 if(contributions.some(item=>!Number.isFinite(item.amount)||item.amount<0))return toast('Los aportes deben ser valores válidos y no negativos.');
 const contributionsTotal=contributions.reduce((sum,item)=>sum+item.amount,0);
 if(Math.abs(contributionsTotal-total)>0.5)return toast(`Los aportes deben sumar ${fmt(total)}.`);
 const previous=id?S.orders.find(o=>o.id==id):null;
 if(id&&!previous)return toast('No se encontró el pedido que quieres editar.');
 const oldItems=previous&&Array.isArray(previous.items)?previous.items:[];
 const retainedIds=new Set(orderDraftItems.map(item=>item.productId).filter(Boolean));
 for(const old of oldItems){
  if(!retainedIds.has(old.productId)&&S.sales.some(s=>s.productId==old.productId))return toast(`No puedes quitar ${old.name}: ya tiene ventas registradas.`);
  const updated=orderDraftItems.find(item=>item.productId===old.productId);
  if(updated&&S.sales.filter(s=>s.productId==old.productId).reduce((sum,s)=>sum+num(s.qty),0)>Number(updated.qty))return toast(`La cantidad de ${old.name} no puede ser menor a las unidades ya vendidas.`);
 }
 const shippingPerUnit=shipping/quantity,orderRef=id?firebase.firestore().collection('equipos').doc(T).collection('orders').doc(id):firebase.firestore().collection('equipos').doc(T).collection('orders').doc();
 const batch=firebase.firestore().batch(),items=[];
 buttonState(true);
 try{
  for(const item of orderDraftItems){
   const productRef=item.productId?firebase.firestore().collection('equipos').doc(T).collection('products').doc(item.productId):firebase.firestore().collection('equipos').doc(T).collection('products').doc();
   const oldProduct=S.products.find(p=>p.id==productRef.id)||{};
   const landedUnitCost=Number(item.unitCost)+shippingPerUnit;
   const productData={name:item.name,orderName:name||`Pedido ${date}`,orderId:orderRef.id,sku:item.sku||oldProduct.sku||'',cost:landedUnitCost,price:Number(item.salePrice),stock:Number(item.qty),photoURL:oldProduct.photoURL||'',websiteURL:oldProduct.websiteURL||'',updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
   batch.set(productRef,productData);
   items.push({productId:productRef.id,name:item.name,sku:productData.sku,qty:Number(item.qty),unitCost:Number(item.unitCost),salePrice:Number(item.salePrice),shippingAllocated:Number(item.qty)*shippingPerUnit,landedUnitCost});
   for(const sale of S.sales.filter(s=>s.productId==productRef.id)){
    batch.set(firebase.firestore().collection('equipos').doc(T).collection('sales').doc(sale.id),{productName:item.name,productCost:landedUnitCost},{merge:true});
   }
  }
  for(const old of oldItems){
   if(!retainedIds.has(old.productId))batch.delete(firebase.firestore().collection('equipos').doc(T).collection('products').doc(old.productId));
  }
  batch.set(orderRef,{name:name||`Pedido ${date}`,date,shippingCost:shipping,shippingPerUnit,quantity,merchandiseCost:merchandise,totalCost:total,contributions,items,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
  await batch.commit();
  closeM();
 }catch(e){
  console.error('No se pudo guardar el pedido:',e);
  buttonState(false);
  toast('No se pudo guardar el pedido. Revisa los permisos de Firestore.');
 }

}
